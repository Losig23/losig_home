services:
  - type: web
    name: losig-home
    env: python
    buildCommand: pip install -r requirements.txt
    # Migrate Postgres to the latest schema, then seed (idempotent).
    preDeployCommand: alembic upgrade head && flask --app wsgi seed
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        value: sqlite:///losig_home.db
      - key: SECRET_KEY
        generateValue: true
