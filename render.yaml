services:
  - type: web
    name: losig-home
    env: python
    buildCommand: pip install -r requirements.txt
    # Render's free tier has no pre-deploy command field, so migrations + seed
    # run as part of startup. Both are idempotent (alembic is a no-op when
    # current; seed skips when routine data exists), so cold starts are safe.
    startCommand: alembic upgrade head && flask --app wsgi seed && gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        value: sqlite:///losig_home.db
      - key: SECRET_KEY
        generateValue: true
